<style>
:root{color-scheme:dark;--canvas:#0b0d10;--surface:#13171c;--hover:#20262d;--line:#2b323b;--text:#e1e6ed;--muted:#919da9;--accent:#c8ff63;--ink:#18210d;--danger:#f3afa4;--add:#98dfb4;--addbg:#12271f;--delbg:#301c20}

*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:0 12px;min-height:34px;white-space:nowrap}button:hover:not(:disabled){background:var(--hover)}button:disabled{cursor:not-allowed;color:var(--muted)}.primary:disabled{background:var(--hover);border-color:var(--line);color:var(--muted)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600}.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.06)}.quiet{border-color:transparent;background:transparent;color:var(--muted)}.selected{background:var(--hover)!important;color:var(--text)!important}.accent{color:var(--accent)}.danger{color:var(--danger)}.muted,small{color:var(--muted)}small{font-size:12px}h1,h2,h3,p{margin-top:0}h1{font-size:23px;line-height:1.3;letter-spacing:-.6px;font-weight:550;margin-bottom:8px}h2{font-size:17px;font-weight:550;letter-spacing:-.2px;margin-bottom:8px}h3{font-size:13px;font-weight:600;margin-bottom:10px}p{margin-bottom:16px}code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}code{font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.7;margin:0}.shell{height:100dvh;display:grid;grid-template-rows:64px minmax(0,1fr) 30px}.topbar{background:var(--surface);display:flex;align-items:center;gap:18px;padding:0 20px;border-bottom:1px solid var(--line)}.brand{font:850 15px ui-monospace,monospace;letter-spacing:.09em}.brand small{color:var(--accent);font-size:10px;letter-spacing:0}.divider{width:1px;height:22px;background:var(--line)}.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:10px}.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{display:inline-flex;border:1px solid var(--line);border-radius:4px;padding:2px 6px;font:11px/1.5 ui-monospace,monospace;color:var(--muted);white-space:nowrap}.badge.local{color:var(--accent)}.segmented{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:7px}.segmented button{border:0;min-height:28px;background:transparent;color:var(--muted)}.statusbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);background:var(--surface)}#content{min-height:0;overflow:hidden}.launcher{width:680px;max-width:calc(100% - 64px);margin:clamp(48px,12vh,120px) auto 0}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:12px}.choices{border:1px solid var(--line);border-radius:8px;margin-top:26px;overflow:hidden}.choice{display:flex;align-items:center;width:100%;gap:24px;padding:22px 24px;border:0;border-radius:0;text-align:left;white-space:normal}.choice+.choice{border-top:1px solid var(--line)}.choice>span:first-child{width:26px;font:17px ui-monospace,monospace;color:var(--accent)}.choice strong{display:block;font-size:15px;font-weight:550;margin-bottom:5px}.choice small{display:block;font-size:13px}.choice .arrow{margin-left:auto;color:var(--muted)}.launcher footer{border-top:1px solid var(--line);margin-top:24px;padding-top:16px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.factory{height:100%;display:grid;grid-template-rows:52px minmax(0,1fr)}.steps{display:flex;align-items:center;padding:0 22px;gap:6px;border-bottom:1px solid var(--line);background:var(--surface)}.steps button{border:0;background:transparent;color:var(--muted);padding:0 10px}.steps .number{font:11px ui-monospace,monospace;margin-right:7px;color:var(--accent)}.steps .between{color:var(--muted);margin:0 2px}.stage{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:0}.mainpanel{min-width:0;min-height:0;display:flex;flex-direction:column}.scroll{min-height:0;overflow:auto;padding:28px 32px;flex:1}.panel-head{margin-bottom:24px}.inspector{min-width:0;border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:20px}.inspector h3{margin-bottom:18px}.inspector section{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.inspector p{font-size:12px;color:var(--muted)}.inspector .artifact{display:block;width:100%;text-align:left;min-height:58px;margin-top:8px;white-space:normal}.artifact small{display:block}.actionbar{border-top:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);flex:none}.actionbar small{max-width:440px}.field{display:grid;gap:7px;margin:20px 0;color:var(--muted);font-size:12px}input,textarea,select{width:100%;background:var(--canvas);border:1px solid var(--line);border-radius:5px;padding:10px;color:var(--text)}textarea{resize:vertical;min-height:110px;max-height:180px}.spec{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:20px}.spec>header{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}.criteria{list-style:none;padding:0;margin:0}.criteria li{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px}.criteria li:last-child{border:0}.criteria .mono{color:var(--muted);font-size:11px;padding-top:2px}.note{font-size:12px;color:var(--muted);margin:16px 0}.diagram{width:100%;display:block;height:214px;border:1px solid var(--line);border-radius:6px;background:var(--surface);margin:20px 0}.diagram rect{fill:var(--canvas);stroke:var(--line)}.diagram text{fill:var(--text);font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.diagram .sub{fill:var(--muted);font-size:10px}.diagram path{fill:none;stroke:var(--accent);stroke-width:1.5}.diagram .accentnode{stroke:var(--accent)}details{border:1px solid var(--line);border-radius:5px;padding:10px 12px;margin:16px 0}summary{cursor:pointer;color:var(--muted);font-size:12px}details pre{margin-top:12px}.tasklist{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:20px}.task{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;padding:16px 14px;border-bottom:1px solid var(--line);align-items:start}.task:last-child{border:0}.task .id{font:11px ui-monospace,monospace;color:var(--muted);padding-top:3px}.task strong{display:block;font-weight:550;margin-bottom:4px}.task small{display:block}.policy{display:flex;gap:10px;align-items:flex-start;margin:18px 0;font-size:12px;color:var(--muted)}.policy input{width:16px;height:16px;accent-color:var(--accent);margin-top:2px}.run-state{border:1px solid var(--line);border-radius:6px;padding:18px;margin:20px 0;background:var(--surface)}.run-state h2{margin:8px 0}.log{border-top:1px solid var(--line);margin-top:18px;padding-top:14px;display:grid;gap:9px;font-size:12px}.log span{color:var(--muted);font:11px ui-monospace,monospace;margin-right:12px}.queue-layout{display:grid;grid-template-columns:245px minmax(0,1fr);height:100%;min-height:0}.queue-list{border-right:1px solid var(--line);overflow:auto;background:var(--surface)}.queue-list header{padding:18px 16px;border-bottom:1px solid var(--line)}.queue-item{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;min-height:100px;display:block;text-align:left;white-space:normal;padding:15px 16px}.queue-item strong{font-size:12px;font-weight:550;display:block;margin:7px 0}.queue-item small{font-size:11px}.queue-detail{min-height:0;min-width:0;display:flex;flex-direction:column}.detail-head{padding:20px 24px 0}.tabs{display:flex;gap:6px;margin-top:18px;border-bottom:1px solid var(--line)}.tabs button{border:0;background:transparent;border-radius:0;color:var(--muted);padding:0 12px;min-height:38px}.tabs button.selected{border-bottom:2px solid var(--accent);background:transparent!important}.queue-detail .scroll{padding:20px 24px}.diff{border:1px solid var(--line);border-radius:5px;overflow-x:auto}.diff header{padding:10px 12px;background:var(--surface);font:12px ui-monospace,monospace;border-bottom:1px solid var(--line)}.diff-line{display:flex;gap:16px;padding:3px 12px;white-space:pre;font:12px/1.8 ui-monospace,monospace}.diff-line span{color:var(--muted);width:18px;flex:none;text-align:right}.add{background:var(--addbg);color:var(--add)}.del{background:var(--delbg);color:var(--danger)}.receipt{display:grid;grid-template-columns:100px 1fr;gap:8px 14px;font-size:12px}.receipt dt{color:var(--muted)}.receipt dd{margin:0;overflow-wrap:anywhere}.code-note{font-size:11px;color:var(--muted);margin-bottom:14px}.workspace{height:100%;display:grid;grid-template-columns:225px minmax(0,1fr) 56px}.changes{border-right:1px solid var(--line);background:var(--surface);overflow:auto}.changes header{padding:12px 8px;border-bottom:1px solid var(--line);display:flex;gap:2px}.changes header button{padding:0 8px;border:0;background:transparent}.file{display:block;text-align:left;width:calc(100% - 16px);margin:8px;border:0;min-height:54px;padding:9px;white-space:normal}.file small{display:block}.review-center{min-width:0;min-height:0;display:flex;flex-direction:column}.review-tools{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.review-center>.scroll{padding:20px}.rails{border-left:1px solid var(--line);background:var(--surface);display:flex;align-items:center;flex-direction:column;padding:8px 0;gap:14px}.rails button{border:0;background:transparent;width:48px;min-height:76px;padding:6px 0;color:var(--muted)}.rails b{display:block;font:13px ui-monospace,monospace;margin-bottom:7px}.rails small{writing-mode:vertical-rl;font-size:11px;letter-spacing:.08em}.dock{border-top:1px solid var(--line);background:var(--surface);height:185px;flex:none}.dock header{height:38px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.dock pre{padding:18px;color:var(--muted)}.workspace.notes-open{grid-template-columns:225px minmax(0,1fr) 260px 56px}.notes{padding:20px 16px;background:var(--surface);border-left:1px solid var(--line);overflow:auto}dialog{width:560px;max-width:calc(100vw - 48px);max-height:calc(100vh - 48px);overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);padding:0;box-shadow:0 24px 80px #0005}dialog::backdrop{background:#0008}dialog header{padding:20px 24px;border-bottom:1px solid var(--line)}dialog .body{padding:20px 24px}dialog footer{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}dialog p{color:var(--muted)}.readonly{padding:12px;border:1px solid var(--line);border-radius:5px}.hidden{display:none!important}
@media(max-width:1150px){.stage{grid-template-columns:minmax(0,1fr) 260px}.scroll{padding:24px}.inspector{padding:18px}.queue-layout{grid-template-columns:210px minmax(0,1fr)}.detail-head,.queue-detail .scroll{padding-left:18px;padding-right:18px}.queue-detail .actionbar{padding:12px 16px;gap:8px}.queue-detail .actionbar .row{gap:6px}.queue-detail .actionbar button{padding:0 8px}.topbar{gap:12px}.topbar .badge{font-size:10px}.steps{padding:0 12px;gap:2px}.steps button{padding:0 7px}.actionbar small{max-width:290px}}
@media(max-height:780px){.scroll{padding-top:20px;padding-bottom:20px}.panel-head{margin-bottom:16px}.diagram{height:180px}.launcher{margin-top:60px}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar"><button id="theme" class="quiet" aria-label="Switch to light theme" title="Switch theme">◐</button><div class="brand">RIFT<small>code</small></div><span class="divider"></span><button id="home" class="quiet">Workspace</button><span id="project" class="muted">Sample project / reading-list</span><div class="grow"></div><span class="badge">Design preview · synthetic fixture</span><div id="modes" class="segmented hidden"><button data-action="creation">Creation</button><button data-action="review">Review</button></div></header>
<section id="content"></section>
<footer class="statusbar"><span>Browser-only preview · no provider, Git or filesystem operations</span><span id="footer-state">Session-only · reset on reload</span></footer>
</main>
<dialog id="modal" aria-labelledby="dialog-title"></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s);
const state={view:'home',step:0,approved:false,consent:false,reqApproved:false,architectureApproved:false,run:'idle',selected:0,tab:'patch',reviewed:new Set(),rework:new Set(),feedback:new Map(),dock:false,notes:false,reviewMode:false,explorer:false};
const tasks=Object.freeze([
Object.freeze({id:'T01',title:'Normalize saved titles',file:'src/normalize-title.ts',test:'tests/normalize-title.test.ts',snapshot:'fixture-snapshot-01',receipt:'fixture-check-01',patch:['export function normalizeTitle(value: string) {','-  return value;','+  return value.trim();','}'],check:'node --experimental-strip-types --test tests/normalize-title.test.ts',log:'Fixture transcript: 2 tests, 2 passed; exit 0.'}),
Object.freeze({id:'T02',title:'Reject an empty title',file:'src/add-entry.ts',test:'tests/add-entry.test.ts',snapshot:'fixture-snapshot-02',receipt:'fixture-check-02',patch:['export function addEntry(title: string) {','+  if (!title.trim()) {','+    throw new Error("Title is required");','+  }','   return { title: title.trim() };','}'],check:'node --experimental-strip-types --test tests/add-entry.test.ts',log:'Fixture transcript: 3 tests, 3 passed; exit 0.'}),
Object.freeze({id:'T03',title:'Show a helpful validation message',file:'src/entry-form.ts',test:'tests/entry-form.test.ts',snapshot:'fixture-snapshot-03',receipt:'fixture-check-03',patch:['function submit(title: string) {','+  message.textContent = "Title is required";','}'],check:'node --experimental-strip-types --test tests/entry-form.test.ts',log:'Fixture transcript: expected inline message; received empty string. Exit 1.'})]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function btn(label,action,cls='',disabled=false){return `<button data-action="${action}" class="${cls}" ${disabled?'disabled':''}>${label}</button>`}
function diagram(){return `<svg class="diagram" viewBox="0 0 600 214" role="img" aria-label="Static architecture preview: Entry form sends a title to validation, then local storage; supporting documents are outside Git"><rect x="28" y="49" width="144" height="64" rx="5"/><text x="100" y="76" text-anchor="middle">Entry form</text><text class="sub" x="100" y="94" text-anchor="middle">Inline feedback</text><path d="M172 81h52m-7-5 7 5-7 5"/><rect class="accentnode" x="226" y="49" width="148" height="64" rx="5"/><text x="300" y="76" text-anchor="middle">Title validation</text><text class="sub" x="300" y="94" text-anchor="middle">Trim → reject empty</text><path d="M374 81h52m-7-5 7 5-7 5"/><rect x="428" y="49" width="144" height="64" rx="5"/><text x="500" y="76" text-anchor="middle">Local storage</text><text class="sub" x="500" y="94" text-anchor="middle">Existing entry model</text><text class="sub" x="300" y="162" text-anchor="middle">Code boundary: form + validation + scoped tests</text><text class="sub" x="300" y="185" text-anchor="middle">Planning documents live outside the checkout</text></svg>`}
function artifactPanel(){return `<aside class="inspector"><h3>Artifact inspector</h3><span class="badge local">Local · not in PR</span><p style="margin-top:12px">Proposed storage outside the checkout. Read-only in review.</p><button class="artifact" data-action="requirements-doc">requirements.md<small>Acceptance criteria · revision 1</small></button><button class="artifact" data-action="architecture-doc">architecture.mmd<small>Mermaid source + static preview</small></button><button class="artifact" data-action="plan-doc">task-plan.md<small>Sequential execution · revision 1</small></button><section><h3>Storage boundary</h3><code>Rift app data / factories /<br>sample-01 / artifacts /</code><p style="margin-top:12px">Outside <code>reading-list/</code>, not merely untracked. No files are written by this preview.</p></section><section><h3>Review policy</h3><p>Implement and test sequentially after plan approval. Review each immutable revision whenever you choose.</p><p>Ready ≠ reviewed. No automatic accept, commit or merge.</p></section></aside>`}
function render(){
$('#modes').classList.toggle('hidden',state.view==='home');$('#project').classList.toggle('hidden',state.view==='home');
$('#modes').querySelectorAll('button').forEach(b=>b.classList.toggle('selected',b.dataset.action===state.view));
$('#home').textContent=state.view==='home'?'Workspace':'← Workspace';
if(state.view==='home')renderHome();else if(state.view==='creation')renderFactory();else renderReview();
}
function renderHome(){$('#content').innerHTML=`<section class="launcher"><div class="eyebrow">Workspace</div><h1>What are you working on?</h1><p class="muted">Start from an idea, or take a closer look at code.</p><div class="choices"><button class="choice" data-action="creation"><span aria-hidden="true">＋</span><span><strong>Creation</strong><small>Shape requirements, approve a plan, then queue task reviews.</small></span><span class="arrow">→</span></button><button class="choice" data-action="review"><span aria-hidden="true">±</span><span><strong>Review</strong><small>Open the familiar code workspace, notes and native agent sessions.</small></span><span class="arrow">→</span></button></div><footer><span>Sample project: <strong>reading-list</strong></span><span>No repository is opened in this preview.</span></footer></section>`}
function renderFactory(){const names=['Requirements','Architecture','Plan','Run','Review queue'];$('#content').innerHTML=`<div class="factory"><nav class="steps" aria-label="Creation workflow">${names.map((n,i)=>`${i?'<span class="between">›</span>':''}<button data-step="${i}" ${state.step===i?'aria-current="step" class="selected"':''}><span class="number">0${i+1}</span>${n}</button>`).join('')}<div class="grow"></div><span class="badge">Plan r1</span></nav><div class="stage"><section class="mainpanel" id="stage-main"></section>${artifactPanel()}</div></div>`;[requirements,architecture,plan,run,queue][state.step]()}
function requirements(){$('#stage-main').innerHTML=`<div class="scroll"><header class="panel-head"><div class="eyebrow">Requirements / draft r1</div><h1>A small change, clearly bounded.</h1><p class="muted">Sample brief for a local reading list. Edit the idea before approving scope.</p></header><label class="field">What should change?<textarea id="idea">When I save a reading-list entry, trim its title and reject an empty title with a helpful inline message.</textarea></label><div class="spread"><h3 style="margin:0">Acceptance criteria</h3>${btn('Edit requirements','edit-requirements','quiet')}</div><div class="spec"><ul class="criteria"><li><span class="mono">AC01</span><span>Leading and trailing whitespace is removed before saving.</span></li><li><span class="mono">AC02</span><span>An empty title is rejected without creating an entry.</span></li><li><span class="mono">AC03</span><span>The form shows an inline message and keeps the entered title.</span></li></ul></div><p class="note">Out of scope: sign-in, sync, dependencies and deployment.</p></div><footer class="actionbar"><small>${state.reqApproved?'Requirements accepted in this preview.':'Your approval fixes the scope for architecture and planning.'}</small>${btn(state.reqApproved?'View architecture →':'Approve requirements →','approve-requirements','primary')}</footer>`;$('#idea').value=state.idea||$('#idea').value;$('#idea').addEventListener('input',e=>{state.idea=e.target.value;state.reqApproved=false;state.architectureApproved=false;state.approved=false})}
function architecture(){$('#stage-main').innerHTML=`<div class="scroll"><div class="eyebrow">Architecture / draft r1</div><h1>Keep validation close to the form.</h1><p class="muted">Reuse the existing entry model. No new service or dependency.</p>${diagram()}<div class="spread"><h3>Decision record</h3><span class="badge local">Local · not in PR</span></div><p>Normalize once at the save boundary; reject an empty result before storage. The form owns the inline feedback.</p><details><summary>Mermaid source · read-only preview</summary><pre>flowchart LR\n  Form[Entry form] --> Validate[Title validation]\n  Validate --> Store[Local storage]</pre></details><p class="note">This illustration is owned static SVG, not rendered from user or provider input.</p></div><footer class="actionbar"><small>${state.reqApproved?'Architecture is a separate approval, not permission to execute.':'Approve the requirements before accepting this decision.'}</small>${btn('Accept architecture →','approve-architecture','primary',!state.reqApproved)}</footer>`}
function plan(){$('#stage-main').innerHTML=`<div class="scroll"><div class="spread"><div class="eyebrow">Task plan / revision 1</div><span class="badge ${state.approved?'local':''}">${state.approved?'Approved':'Not approved'}</span></div><h1>Three tasks. One execution lane.</h1><p class="muted">Each task captures its own code, checks and supporting artifacts.</p><div class="tasklist">${tasks.map((t,i)=>`<div class="task"><span class="id">${t.id}</span><div><strong>${t.title}</strong><small>${esc(t.file)} + scoped test</small><small>${i?'Depends on '+tasks[i-1].id:'No prerequisites'} · ${i===0?'AC01':i===1?'AC02':'AC03'}</small></div><span class="badge">Queued</span></div>`).join('')}</div><label class="policy"><input id="consent" type="checkbox" ${state.consent?'checked':''}><span>Approve these tasks in order, scoped local checks and queued individual review. No dependency installs, network, commits or merge. Native tool approvals still apply.</span></label><p class="note">Failed prerequisites block dependents. Review can wait; task evidence cannot be overwritten by later work.</p></div><footer class="actionbar"><small>${state.architectureApproved?'Approve scope first. Starting the run is a separate action.':'Requirements and architecture must be accepted first.'}</small>${btn(state.approved?'View run →':'Approve plan r1 →',state.approved?'go-run':'approve-plan','primary',!state.consent||!state.architectureApproved)}</footer>`;$('#consent').onchange=e=>{state.consent=e.target.checked;plan()}}
function readyCount(){return state.run==='complete'?2:0}
function run(){const r=state.run;const heading={idle:'Ready when you are.',running:'T01 · Implementing and checking',blocked:'Blocked · native approval required',stopped:'Stopped by you',failed:'T01 · Check failed',complete:'T03 failed. Earlier reviews are ready.'}[r];$('#stage-main').innerHTML=`<div class="scroll"><div class="spread"><div class="eyebrow">Execution / sample states</div><span class="badge ${state.approved?'local':''}">${state.approved?'Plan r1 approved':'Plan not approved'}</span></div><h1>${heading}</h1><p class="muted">No process is running. Controls below step through a synthetic run.</p><div class="run-state"><div class="spread"><strong>Sequential worker</strong><span class="badge">${esc(r)}</span></div><div class="log"><div><span>Scope</span>T01 → T02 → T03 · stop on failed prerequisite</div><div><span>Snapshot</span>${r==='complete'?'T01 r1 + T02 r1 retained independently':'Captured per completed task revision'}</div><div><span>Approval</span>${r==='blocked'?'Provider asks to execute a local test. Awaiting native confirmation.':'Native prompts remain under your control.'}</div></div></div>${r==='running'?`<div class="row">${btn('Simulate native approval block','block')}${btn('Simulate check failure','fail')}</div>`:''}${r==='blocked'?`<p class="danger">Blocked in this browser: there is no native terminal to confirm the request.</p>${btn('Open native confirmation (unavailable)','native','',true)}`:''}${r==='failed'?'<p class="danger">Sample check exited 1. T02 and T03 remain blocked; nothing is marked ready.</p>':''}${r==='stopped'?'<p class="note">No new task starts. Already captured revisions would remain reviewable.</p>':''}${r==='complete'?`<div class="tasklist">${tasks.map((t,i)=>`<div class="task"><span class="id">${t.id}</span><div><strong>${t.title}</strong><small>Revision 1 · ${i<2?'fixture receipt captured':'sample check exited 1'}</small></div><span class="badge ${i<2?'local':''}">${i<2?'Ready':'Failed'}</span></div>`).join('')}</div>`:''}<p class="note">Fixture checks are invented examples, not verification of any implementation. No automatic timers or fake progress percentages.</p></div><footer class="actionbar"><small>${readyCount()} ready · ${state.reviewed.size} reviewed · reviewed does not mean merged</small><div class="row">${r==='running'?btn('Stop','stop','danger'):''}${r==='idle'||r==='stopped'?btn('Start sample run','start','primary',!state.approved):r==='running'?btn('Load completed-run fixture →','complete','primary'):r==='complete'?btn('Review queue →','open-queue','primary'):btn('Reset sample run','reset-run')}</div></footer>`}
function queue() {const n=readyCount(), t=tasks[state.selected];$('#stage-main').innerHTML=`<div class="queue-layout"><aside class="queue-list"><header><h3>Task reviews</h3><small>${n} ready · ${state.reviewed.size} reviewed</small></header>${n?tasks.map((t,i)=>`<button class="queue-item ${state.selected===i?'selected':''}" data-task="${i}" aria-pressed="${state.selected===i}"><span class="mono muted">${t.id} / r1</span><strong>${t.title}</strong><small>${i===2?'Failed · not ready':state.reviewed.has(i)?'Reviewed · not merged':state.rework.has(i)?'Rework requested · r1 retained':'Ready · awaiting review'}</small></button>`).join(''):'<p class="note" style="padding:16px">No completed tasks yet. Approve the plan and start the sample run.</p>'}</aside><section class="queue-detail">${n?`<header class="detail-head"><div class="spread"><span class="badge">Immutable fixture / ${t.id} r1</span><span class="badge ${state.selected<2?'local':''}">${state.selected===2?'Failed':'Ready'}</span></div><h2 style="margin-top:14px">${t.title}</h2><small>${t.snapshot} · isolated from later task changes</small><nav class="tabs" aria-label="Task revision artifacts">${['patch','checks','docs'].map(tab=>`<button data-tab="${tab}" class="${state.tab===tab?'selected':''}">${{patch:'Code patch',checks:'Checks',docs:'Docs & diagrams'}[tab]}</button>`).join('')}</nav></header><div class="scroll" id="task-content"></div><footer class="actionbar"><small>${state.reviewed.has(state.selected)?'r1 marked reviewed. No commit or merge.':state.rework.has(state.selected)?'r1 preserved. Rework r2 pending, not executed.':'Human review applies only to this revision.'}</small><div class="row">${btn('Request rework','rework','',state.selected===2||state.rework.has(state.selected))}${btn(state.reviewed.has(state.selected)?'Reviewed ✓':'Mark reviewed','mark-reviewed','primary',state.selected===2||state.reviewed.has(state.selected)||state.rework.has(state.selected))}</div></footer>`:`<div class="scroll"><div class="eyebrow">Review queue</div><h1>Review on your schedule.</h1><p class="muted">Each completed task will keep a separate patch, check receipt and artifact snapshot.</p>${btn('Go to run','go-run','primary')}</div>`}</section></div>`;if(n)renderTask()}
function renderTask(){const t=tasks[state.selected];let body='';if(state.tab==='patch'){body=`<p class="code-note">Synthetic code · ${t.id} r1 only · supporting artifacts excluded</p><div class="diff"><header>${t.file}</header>${t.patch.map((line,i)=>`<div class="diff-line ${line.startsWith('+')?'add':line.startsWith('-')?'del':''}"><span>${i+1}</span>${esc(line)}</div>`).join('')}</div><div class="diff" style="margin-top:16px"><header>${t.test} · sample test patch</header><div class="diff-line add"><span>1</span>+ test('${state.selected===0?'trims a saved title':state.selected===1?'rejects an empty title':'shows inline feedback'}', () =&gt; {</div><div class="diff-line add"><span>2</span>+   // illustrative assertion body omitted</div><div class="diff-line add"><span>3</span>+ });</div></div><p class="note">Illustrative diff, not runnable source. Inspect the receipt separately; a patch does not establish a passing test.</p>`}else if(state.tab==='checks'){body=`<div class="spread"><h3>Sample execution receipt</h3><span class="badge">Fixture · not executed</span></div><dl class="receipt"><dt>Receipt</dt><dd class="mono">${t.receipt}</dd><dt>Task revision</dt><dd>${t.id} / r1</dd><dt>Source snapshot</dt><dd class="mono">${t.snapshot}</dd><dt>Command</dt><dd class="mono">${t.check}</dd><dt>Working dir</dt><dd class="mono">/sample/reading-list</dd><dt>Exit code</dt><dd class="${state.selected===2?'danger':'accent'}">${state.selected===2?'1 · failed':'0 · sample pass'}</dd><dt>Provenance</dt><dd>Hand-authored design fixture. No runner, timestamp or real source digest exists.</dd></dl><div class="readonly"><pre>${esc(t.log)}</pre></div><p class="note">Production needs real command, cwd, start/end times, source digest, exit code and retained stdout/stderr. Native agent prose is not a receipt.</p>`}else{body=`<div class="spread"><h3>Supporting artifacts / r1</h3><span class="badge local">Local · not in PR</span></div><p class="muted">Read-only snapshot stored outside the Git checkout.</p>${diagram()}<p><code>requirements.md</code> · ${state.selected===0?'AC01':state.selected===1?'AC02':'AC03'}<br><code>architecture.mmd</code> · validation boundary</p>${btn('Inspect artifact storage','architecture-doc')}<p class="note">No stage, export-to-repository or edit action is offered here.</p>`}$('#task-content').innerHTML=(state.rework.has(state.selected)?`<div class="readonly" style="margin-bottom:18px"><strong>Rework r2 · pending, not executed</strong><p style="margin:8px 0 0">${esc(state.feedback.get(state.selected))}</p><small>Original r1 evidence remains below, unchanged.</small></div>`:'')+body}
function renderReview(){$('#content').innerHTML=`<div class="workspace ${state.notes?'notes-open':''}"><aside class="changes"><header>${btn('Changes','changes',state.explorer?'':'selected')}${btn('Explorer','explorer',state.explorer?'selected':'')}</header><p class="note" style="padding:0 16px">${state.explorer?'src /':'Sample comparison / working tree'}</p><button class="file ${!state.sampleTest?'selected':''}" data-action="sample-file"><span class="accent">M</span> normalize-title.ts<small>src / +1 −1 · synthetic</small></button><button class="file ${state.sampleTest?'selected':''}" data-action="sample-test">normalize-title.test.ts<small>tests / sample assertion</small></button><div style="padding:16px"><span class="badge">Checkpoint / sample-01</span><p class="note">Existing navigation retained; no repository is read.</p></div></aside><section class="review-center"><div class="review-tools"><strong>${state.reviewMode?'Review':'normalize-title.ts'}</strong><span class="muted grow">${state.reviewMode?'Native review workspace · preview only':'src / sample comparison'}</span>${!state.reviewMode?btn(state.dock?'Hide Agent dock':'Dock Agent','dock'):''}</div><div class="scroll">${state.reviewMode?`<div class="eyebrow">Review comparison</div><h2>Keep the native review session.</h2><p class="muted">The Review rail opens this full work surface, never a Review dock.</p><label class="field">Scope<select><option>Sample comparison</option><option>Current sample file</option></select></label><label class="field">Provider<select><option>Choose in the actual app</option></select></label>${btn('Start native review (unavailable)','native','primary',true)}<p class="note">No provider session exists in this browser preview.</p>`:`<p class="code-note">Existing review composition / synthetic code only</p><div class="diff"><header>${state.sampleTest?'tests/normalize-title.test.ts':'src/normalize-title.ts'}</header>${(state.sampleTest?["+ test('trims title', () => {","+   // illustrative assertion","+ });"]:tasks[0].patch).map((l,i)=>`<div class="diff-line ${l.startsWith('+')?'add':l.startsWith('-')?'del':''}"><span>${i+1}</span>${esc(l)}</div>`).join('')}</div><p class="note">Notes, Agent docking, file navigation and checkpoints stay in the current review workspace. Creation is a separate surface, not a replacement.</p>`}</div>${state.dock&&!state.reviewMode?`<section class="dock"><header><strong>Agent <small>· no active session</small></strong>${btn('Close dock','dock','quiet')}</header><pre>Native provider terminal belongs here.\nNo application-level follow-up composer.\nThis design preview does not start a provider.</pre></section>`:''}</section>${state.notes?'<aside class="notes"><h3>Notes / synthetic</h3><p class="muted">Check the empty-title case before accepting this change.</p></aside>':''}<nav class="rails" aria-label="Workspace tools"><button data-action="notes" aria-label="Notes" aria-pressed="${state.notes}"><b>N</b><small>Notes</small></button><button data-action="agent" aria-label="Agent" aria-pressed="${state.dock&&!state.reviewMode}"><b>&gt;_</b><small>Agent</small></button><button data-action="native-review" aria-label="Review" aria-pressed="${state.reviewMode}"><b>R</b><small>Review</small></button></nav></div>`}
function showDialog(title,body,footer){const d=$('#modal');d.innerHTML=`<header><h2 id="dialog-title" style="margin:0">${title}</h2></header><div class="body">${body}</div><footer>${btn('Cancel','close-dialog')}${footer||btn('Close','close-dialog','primary')}</footer>`;d.showModal()}
function documentDialog(kind){const name={requirements:'requirements.md',architecture:'architecture.mmd',plan:'task-plan.md'}[kind];showDialog(name,`<span class="badge local">Local · not in PR · read-only</span><p style="margin-top:16px">Proposed location: Rift app data / factories / sample-01 / artifacts / ${name}</p>${kind==='architecture'?diagram()+`<pre>flowchart LR\n  Form --> Validate --> Store</pre>`:kind==='requirements'?'<p>AC01 · Trim before save.<br>AC02 · Reject empty titles.<br>AC03 · Show inline feedback.</p>':'<p>T01 → T02 → T03, sequentially.<br>Each revision retains its own patch, checks and artifact snapshot.</p>'}<p class="note">Design fixture only. The production storage root must be resolved and enforced outside the checkout, not protected only by .gitignore.</p>`)}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.step!==undefined){state.step=+el.dataset.step;render();return}if(el.dataset.task!==undefined){state.selected=+el.dataset.task;queue();return}if(el.dataset.tab){state.tab=el.dataset.tab;queue();return}const a=el.dataset.action;
switch(a){case'creation':case'review':state.view=a;render();break;case'approve-requirements':state.idea=$('#idea').value;if(!state.idea.trim()){ $('#idea').focus();return;}state.reqApproved=true;state.step=1;render();break;case'edit-requirements':showDialog('Requirements / draft r1',`<p>Edit the brief. Saving invalidates scope and plan approvals; historical task snapshots remain unchanged.</p><label class="field">What should change?<textarea id="dialog-idea">${esc(state.idea||$('#idea').value)}</textarea></label><p class="note">Acceptance criteria are fixed sample content. No agent generates a new plan here.</p>`,btn('Save brief','save-brief','primary'));break;case'save-brief':if(!$('#dialog-idea').value.trim()){$('#dialog-idea').focus();return}state.idea=$('#dialog-idea').value;state.reqApproved=false;state.architectureApproved=false;state.approved=false;$('#modal').close();requirements();break;case'approve-architecture':if(state.reqApproved){state.architectureApproved=true;state.step=2;render()}break;case'approve-plan':if(state.consent&&state.architectureApproved){showDialog('Approve plan r1?',`<p>Authorize the three scoped tasks to run sequentially in this sample. Individual reviews may wait; acceptance is never automatic.</p><ul><li>Local checks only; no installs or network.</li><li>Native provider/tool consent remains separate.</li><li>No commit, merge or deployment.</li></ul><span class="badge">Synthetic interaction · no execution</span>`,btn('Approve this plan','confirm-plan','primary'))}break;case'confirm-plan':state.approved=true;state.step=3;$('#modal').close();render();break;case'start':if(state.approved){state.run='running';run()}break;case'stop':state.run='stopped';run();break;case'block':state.run='blocked';run();break;case'fail':state.run='failed';run();break;case'complete':state.run='complete';run();break;case'reset-run':state.run='idle';run();break;case'back-plan':state.step=2;render();break;case'open-queue':state.step=4;render();break;case'go-run':state.step=3;render();break;case'mark-reviewed':showDialog('Mark this revision reviewed?',`<p>${tasks[state.selected].id} / r1 only. This records human review in this browser session; it does not accept future revisions, commit or merge code.</p><p>The sample check receipt is a fixture, not a real test result.</p>`,btn('Mark r1 reviewed','confirm-reviewed','primary'));break;case'confirm-reviewed':state.reviewed.add(state.selected);$('#modal').close();queue();break;case'rework':showDialog('Request a new revision',`<p>${tasks[state.selected].id} r1 remains immutable, including the original code and check receipt. Rework would create r2; it cannot silently replace r1.</p><label class="field">Review feedback<textarea id="feedback" placeholder="What needs to change?" required></textarea></label><p>No rework is executed in this preview.</p>`,btn('Request r2','confirm-rework','primary'));break;case'confirm-rework':if(!$('#feedback').value.trim()){$('#feedback').focus();return}state.rework.add(state.selected);state.feedback.set(state.selected,$('#feedback').value);$('#modal').close();queue();break;case'close-dialog':$('#modal').close();break;case'requirements-doc':documentDialog('requirements');break;case'architecture-doc':documentDialog('architecture');break;case'plan-doc':documentDialog('plan');break;case'notes':state.notes=!state.notes;renderReview();break;case'dock':state.dock=!state.dock;state.reviewMode=false;renderReview();break;case'agent':state.dock=true;state.reviewMode=false;renderReview();break;case'native-review':state.reviewMode=!state.reviewMode;renderReview();break;case'changes':state.explorer=false;renderReview();break;case'explorer':state.explorer=true;renderReview();break;case'sample-file':state.sampleTest=false;state.reviewMode=false;renderReview();break;case'sample-test':state.sampleTest=true;state.reviewMode=false;renderReview();break;
}});
$('#home').onclick=()=>{state.view='home';render()};$('#theme').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';$('#theme').setAttribute('aria-label',light?'Switch to dark theme':'Switch to light theme')};
render();
</script>
</body></html>
